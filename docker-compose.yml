services:
  postgres:
    image: postgres:16-alpine
    container_name: autopatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopatch_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-autopatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopatch -d autopatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autopatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: autopatch-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mock-upstream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopatch-mock-upstream
    restart: unless-stopped
    command: uvicorn backend.app.mock_upstream.server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopatch-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://autopatch:autopatch_local_dev@postgres:5432/autopatch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPSTREAM_DEMO_URL: http://mock-upstream:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      mock-upstream:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             python -m backend.app.db_seed &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopatch-worker
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://autopatch:autopatch_local_dev@postgres:5432/autopatch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m backend.app.workers.worker

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
